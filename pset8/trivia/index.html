<!DOCTYPE html>

<html lang="en">

    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            // TODO: Add code to check answers to questions
            document.addEventListener('DOMContentLoaded', function() {
                document.querySelector('#e').addEventListener('click', function() {
                    document.getElementById("e").style.background = "red";
                    document.getElementById("q").innerHTML = `Incorrect`;
                });
                document.querySelector('#j').addEventListener('click', function() {
                    document.getElementById("j").style.background = "red";
                    document.getElementById("q").innerHTML = `Incorrect`;
                });
                document.querySelector('#s').addEventListener('click', function() {
                    document.getElementById("s").style.background = "green";
                    document.getElementById("q").innerHTML = `Correct!`;
                });
                document.querySelector('#m').addEventListener('click', function() {
                    document.getElementById("m").style.background = "red";
                    document.getElementById("q").innerHTML = `Incorrect`;
                });

                let answer = document.querySelector('input');
                document.getElementById('ca').addEventListener('click', function() {
                    if (answer.value != 'Canberra') {
                        answer.style.backgroundColor = "red";
                        document.getElementById("q2").innerHTML = `Incorrect`;
                    } else {
                        answer.style.backgroundColor = "green";
                        document.getElementById("q2").innerHTML = `Correct`;
                    }
                });
            });
        </script>
    </head>

    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                <h3>Which planet in our solar system has the most moons?</h3>
                <p id="q"></p>
                <button id="e">Earth</button>
                <button id="j">Jupiter</button>
                <button id="s">Saturn</button>
                <button id="m">Mars</button>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                <h3>What is the capital city of Australia?</h3>
                <p id="q2"></p>
                <input autocomplete="off" autofocus name="answer" placeholder="Your answer" type="text" id="answer">
                <button id="ca">Check Answer</button>
            </div>
        </div>
    </body>

</html>
